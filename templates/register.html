{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.65)), url('/static/images/milk_background.png') no-repeat center center fixed !important;
        background-size: cover !important;
    }
    [data-theme="dark"] body {
        background: linear-gradient(135deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('/static/images/milk_background.png') no-repeat center center fixed !important;
        background-size: cover !important;
    }
</style>

<div class="row justify-content-center align-items-center min-vh-75 fade-in-up">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel p-5 text-center">
            <h2 class="mb-2 text-primary" data-i18n="brand_title">🥛 DairyFlow</h2>
            <p class="text-secondary mb-4">Create a new account</p>
            
            <form action="{{ url_for('auth.register') }}" method="POST" id="registerForm">
                <!-- Role Selection -->
                <div class="mb-3 text-start">
                    <label class="form-label">Register As</label>
                    <select name="role" class="form-select form-control-custom" id="roleSelect" onchange="toggleRegisterFields()" required>
                        <option value="customer">Customer (ગ્રાહક)</option>
                        <option value="milkman">Milkman (મિલ્કમેન)</option>
                    </select>
                </div>
                
                <!-- Full Name -->
                <div class="mb-3 text-start">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-card"><i class="fas fa-user text-secondary"></i></span>
                        <input type="text" name="name" class="form-control form-control-custom border-start-0" placeholder="e.g. Aarav Patel" required>
                    </div>
                </div>

                <!-- Mobile Number -->
                <div class="mb-3 text-start">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-card"><i class="fas fa-phone text-secondary"></i></span>
                        <input type="text" name="mobile" class="form-control form-control-custom border-start-0" placeholder="e.g. 9876543210" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3 text-start">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-card"><i class="fas fa-lock text-secondary"></i></span>
                        <input type="password" name="password" id="regPasswordInput" class="form-control form-control-custom border-start-0 border-end-0" placeholder="••••••••" required>
                        <span class="input-group-text bg-transparent border-start-0 border-card" style="cursor:pointer;" onclick="toggleRegPassword()">
                            <i class="fas fa-eye text-secondary" id="regEyeIcon"></i>
                        </span>
                    </div>
                </div>

                <!-- Customer Only Fields -->
                <div id="customerFields">
                    <!-- Society Selection -->
                    <div class="mb-3 text-start">
                        <label class="form-label">Select Society</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 border-card"><i class="fas fa-map-marker-alt text-secondary"></i></span>
                            <select name="society_id" class="form-select form-control-custom border-start-0" id="societySelect" required>
                                <option value="" disabled selected>Choose a society...</option>
                                {% for s in societies %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="mb-4 text-start">
                        <label class="form-label">Full Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 border-card"><i class="fas fa-home text-secondary"></i></span>
                            <input type="text" name="address" id="addressInput" class="form-control form-control-custom border-start-0" placeholder="e.g. House No 42, Patel Nagar" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Register & Get User ID</button>
            </form>
            
            <div class="mt-4 border-top pt-3 text-center">
                <small class="text-secondary">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary font-weight-bold">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleRegisterFields() {
    const role = document.getElementById('roleSelect').value;
    const customerFields = document.getElementById('customerFields');
    const societySelect = document.getElementById('societySelect');
    const addressInput = document.getElementById('addressInput');
    
    if (role === 'customer') {
        customerFields.classList.remove('d-none');
        societySelect.setAttribute('required', 'required');
        addressInput.setAttribute('required', 'required');
    } else {
        customerFields.classList.add('d-none');
        societySelect.removeAttribute('required');
        addressInput.removeAttribute('required');
    }
}

function toggleRegPassword() {
    const input = document.getElementById('regPasswordInput');
    const icon  = document.getElementById('regEyeIcon');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.className = isHidden ? 'fas fa-eye-slash text-primary' : 'fas fa-eye text-secondary';
    icon.style.transform = 'scale(1.3)';
    setTimeout(() => icon.style.transform = 'scale(1)', 180);
}

// Call on load to ensure state consistency
document.addEventListener('DOMContentLoaded', () => {
    toggleRegisterFields();
});
</script>
{% endblock %}
